name: infisical
version: 0.1.0
description: "Load Hermes Agent secrets from Infisical using Universal Auth. Read-only; downloaded secrets remain in process memory."
author: "Pablo Cabrera"
requires_env:
  - name: INFISICAL_HOST_URL
    description: "Infisical base URL: https://app.infisical.com (Cloud US), https://eu.infisical.com (Cloud EU), or your self-hosted URL"
    url: "https://infisical.com/docs/documentation/platform/identities/universal-auth"
    secret: false
  - name: INFISICAL_UNIVERSAL_AUTH_CLIENT_ID
    description: "Client ID from Organization Settings > Access Control > Identities > your Universal Auth Machine Identity; Hermes saves it to the active profile .env"
    url: "https://infisical.com/docs/documentation/platform/identities/universal-auth"
    secret: false
  - name: INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET
    description: "Client Secret generated with Create Client Secret on the Universal Auth Machine Identity; Hermes hides the input and saves it to the active profile .env"
    url: "https://infisical.com/docs/documentation/platform/identities/universal-auth"
    secret: true
