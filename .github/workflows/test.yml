name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HERMES_AGENT_REF: 4a8eeb5d1cd427d200ef2e9b55bc22e48bd4ebca

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest ruff pyyaml python-dotenv rich
      - name: Checkout supported Hermes Agent contract
        run: |
          git init "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C "$RUNNER_TEMP/hermes-agent" fetch --depth 1 origin "$HERMES_AGENT_REF"
          git -C "$RUNNER_TEMP/hermes-agent" checkout --detach FETCH_HEAD
      - name: Compile
        run: python -m compileall -q __init__.py infisical_source.py
      - name: Lint
        run: python -m ruff check .
      - name: Test
        env:
          HERMES_AGENT_REPO: ${{ runner.temp }}/hermes-agent
          PYTHONPATH: ${{ runner.temp }}/hermes-agent
        run: python -m pytest -q -m "not e2e"
