name: CI

run-name: CI / ${{ github.event_name }} / ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  HERMES_AGENT_REPOSITORY: https://github.com/NousResearch/hermes-agent.git
  HERMES_AGENT_REF: 4a8eeb5d1cd427d200ef2e9b55bc22e48bd4ebca
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install locked CI dependencies
        run: "python -m pip install --no-deps --only-binary=:all: -r requirements-ci.txt"

      - name: Compile Python sources
        run: python -m compileall -q __init__.py infisical_source.py tests

      - name: Lint
        run: python -m ruff check .

      - name: Validate plugin manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          manifest = yaml.safe_load(Path("plugin.yaml").read_text(encoding="utf-8"))
          assert manifest["name"] == "infisical"
          assert manifest["version"] == "0.1.0"
          required = {item["name"]: item for item in manifest["requires_env"]}
          assert set(required) == {
              "INFISICAL_HOST_URL",
              "INFISICAL_UNIVERSAL_AUTH_CLIENT_ID",
              "INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET",
          }
          assert required["INFISICAL_HOST_URL"]["secret"] is False
          assert required["INFISICAL_UNIVERSAL_AUTH_CLIENT_ID"]["secret"] is False
          assert required["INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET"]["secret"] is True
          PY

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install locked CI dependencies
        run: "python -m pip install --no-deps --only-binary=:all: -r requirements-ci.txt"

      - name: Checkout supported Hermes Agent contract
        run: |
          git init "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" remote add origin "$HERMES_AGENT_REPOSITORY"
          git -C "$RUNNER_TEMP/hermes-agent" fetch --depth 1 origin "$HERMES_AGENT_REF"
          git -C "$RUNNER_TEMP/hermes-agent" checkout --detach FETCH_HEAD

      - name: Run tests without live credentials
        env:
          HERMES_AGENT_REPO: ${{ runner.temp }}/hermes-agent
          PYTHONPATH: ${{ runner.temp }}/hermes-agent
        run: python -m pytest -q -m "not e2e"
